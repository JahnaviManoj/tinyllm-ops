<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" font-family='system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' role="img" aria-label="Bar chart: strict exact match on the 356-row gate set for each model">
<rect width="1200" height="790" fill="#fcfcfb" rx="14"/>
<text x="24" y="52" font-size="32" font-weight="700" fill="#0b0b0b">How well does each approach read a bank SMS?</text>
<text x="24" y="84" font-size="19" fill="#52514e">Strict exact match on the 356-row gate set. Every field must be exactly right, or the row counts as wrong.</text>
<line x1="603.0" y1="128" x2="603.0" y2="668" stroke="#e1e0d9" stroke-width="1"/>
<text x="603.0" y="120" font-size="14" fill="#898781" text-anchor="middle">25%</text>
<line x1="762.0" y1="128" x2="762.0" y2="668" stroke="#e1e0d9" stroke-width="1"/>
<text x="762.0" y="120" font-size="14" fill="#898781" text-anchor="middle">50%</text>
<line x1="921.0" y1="128" x2="921.0" y2="668" stroke="#e1e0d9" stroke-width="1"/>
<text x="921.0" y="120" font-size="14" fill="#898781" text-anchor="middle">75%</text>
<text x="24" y="154" font-size="15" font-weight="700" fill="#898781" letter-spacing="0.6">WHAT APPS DO TODAY</text>
<text x="24" y="192.0" font-size="20" fill="#0b0b0b">Regex, one pattern per bank</text>
<rect x="444" y="175.0" width="4" height="26" rx="1" fill="#c3c2b7"/>
<text x="454.0" y="195.0" font-size="20" font-weight="500" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">0%</text>
<text x="24" y="244" font-size="15" font-weight="700" fill="#898781" letter-spacing="0.6">SMALL MODELS, NO TRAINING</text>
<text x="24" y="282.0" font-size="20" fill="#0b0b0b">Qwen3.5 0.8B or 2B, zero-shot</text>
<rect x="444" y="265.0" width="4" height="26" rx="1" fill="#c3c2b7"/>
<text x="454.0" y="285.0" font-size="20" font-weight="500" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">0%</text>
<text x="24" y="330.0" font-size="20" fill="#0b0b0b">Qwen3.5 0.8B, few-shot</text>
<path d="M444,313.0 H480.34000000000003 a5,5 0 0 1 5,5 V334.0 a5,5 0 0 1 -5,5 H444 Z" fill="#898781"/>
<text x="495.3" y="333.0" font-size="20" font-weight="500" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">6.5%</text>
<text x="24" y="378.0" font-size="20" fill="#0b0b0b">Qwen3.5 2B, few-shot</text>
<path d="M444,361.0 H508.96000000000004 a5,5 0 0 1 5,5 V382.0 a5,5 0 0 1 -5,5 H444 Z" fill="#898781"/>
<text x="524.0" y="381.0" font-size="20" font-weight="500" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">11.0%</text>
<text x="24" y="430" font-size="15" font-weight="700" fill="#898781" letter-spacing="0.6">SMALL MODELS, FINE-TUNED</text>
<text x="24" y="468.0" font-size="20" fill="#0b0b0b">Qwen3.5 2B</text>
<path d="M444,451.0 H851.7640000000001 a5,5 0 0 1 5,5 V472.0 a5,5 0 0 1 -5,5 H444 Z" fill="#898781"/>
<text x="866.8" y="471.0" font-size="20" font-weight="500" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">64.9%</text>
<rect x="12" y="486" width="1176" height="44" rx="8" fill="#e8f1fc"/>
<text x="24" y="516.0" font-size="20" font-weight="700" fill="#0b0b0b">Qwen3.5 0.8B  (this repo)</text>
<path d="M444,499.0 H847.948 a5,5 0 0 1 5,5 V520.0 a5,5 0 0 1 -5,5 H444 Z" fill="#2a78d6"/>
<text x="862.9" y="519.0" font-size="20" font-weight="700" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">64.3%</text>
<text x="24" y="568" font-size="15" font-weight="700" fill="#898781" letter-spacing="0.6">A 30× BIGGER MODEL, VIA CLOUD API</text>
<text x="24" y="606.0" font-size="20" fill="#0b0b0b">Gemma 4 26B, prompt fixed in advance</text>
<path d="M444,589.0 H610.72 a5,5 0 0 1 5,5 V610.0 a5,5 0 0 1 -5,5 H444 Z" fill="#eb6834"/>
<text x="625.7" y="609.0" font-size="20" font-weight="500" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">27.0%</text>
<text x="24" y="654.0" font-size="20" fill="#0b0b0b">Gemma 4 26B, told the exact schema</text>
<path d="M444,637.0 H898.192 a5,5 0 0 1 5,5 V658.0 a5,5 0 0 1 -5,5 H444 Z" fill="#eb6834"/>
<text x="913.2" y="657.0" font-size="20" font-weight="500" fill="#0b0b0b" style="font-variant-numeric:tabular-nums">72.2%</text>
<line x1="444" y1="128" x2="444" y2="668" stroke="#c3c2b7" stroke-width="2"/>
<rect x="24" y="689" width="16" height="16" rx="4" fill="#898781"/>
<text x="48" y="703" font-size="16" fill="#52514e">runs on a CPU, no API</text>
<rect x="277.2" y="689" width="16" height="16" rx="4" fill="#2a78d6"/>
<text x="301.2" y="703" font-size="16" fill="#52514e">this repo&#x27;s champion, also CPU</text>
<rect x="613.2" y="689" width="16" height="16" rx="4" fill="#eb6834"/>
<text x="637.2" y="703" font-size="16" fill="#52514e">needs a cloud API</text>
<text x="24" y="742" font-size="17" fill="#52514e">Fine-tuning takes a small model from 0% to 64%. The 2B and the 0.8B differ by 2 rows; seed noise alone is 17 rows.</text>
<text x="24" y="768" font-size="17" fill="#52514e">That gap is noise, so by a rule fixed before any run, the tie goes to the smaller model.</text>
</svg>