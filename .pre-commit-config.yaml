repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6         # = the version in uv.lock; CI runs the same one
    hooks:
      - id: ruff         # lint
      - id: ruff-format  # format
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false