repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0          # pick the current version
    hooks:
      - id: ruff         # lint
      - id: ruff-format  # format
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false