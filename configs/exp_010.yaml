# 2.9 improvement iteration: exp_009's winning recipe (r32, lr 2e-4, 4 epochs)
# retrained on train_v2 (= train_v1 + ~600 scenario/non-template examples) with
# EOS termination and DLT sender-ID augmentation. See docs/decisions.md 2026-08-08.
model_id: google/gemma-3-270m-it
dataset_manifest: manifests/train_v2.json
val_manifest: manifests/val_v1.json
seed: 42
lora:
  r: 32
  alpha: 64
  target_modules: [q_proj, k_proj, v_proj, o_proj]
train:
  learning_rate: 2.0e-4
  epochs: 4
  batch_size: 8
  gradient_accumulation: 2
augment:
  sender_id_frac: 0.3
