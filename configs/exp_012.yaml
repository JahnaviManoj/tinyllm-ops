# RETRAIN mini-sweep on train_v3 (FinEE + relabeled originals; see RETRAIN_PLAN.md)
model_id: google/gemma-3-270m-it
dataset_manifest: manifests/train_v3.json
val_manifest: manifests/val_v2.json
seed: 42
lora:
  r: 32
  alpha: 64
  target_modules: [q_proj, k_proj, v_proj, o_proj]
train:
  learning_rate: 2.0e-4
  epochs: 4
  batch_size: 4
  gradient_accumulation: 4
augment:
  sender_id_frac: 0.3
