[project]
name = "tinyllm-ops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

# Core: schema, config, prompt, eval, regex baseline. Light enough that Colab
# has most of it preinstalled, so `pip install -e .[train]` on a fresh VM only
# pays for the training stack.
dependencies = [
    "httpx>=0.28.1",
    "numpy>=1.26",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
# Training + model eval: tinyllm.train, tinyllm.model_eval, tinyllm.baselines.
# torch is deliberately loose-bounded so Colab's preinstalled CUDA build
# satisfies it instead of being downloaded again.
train = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.49.2",
    "datasets>=5.0.0",
    "mlflow>=3.13.0",
    "peft>=0.19.1",
    "torch>=2.4",
    "transformers>=5.14.1",
    "trl>=1.9.0",
]
# Synthetic data generation: tinyllm.data_gen, scenario_gen, test_gen.
gen = [
    "datasketch>=2.0.0",
    "google-genai>=2.14.0",
]
# Blob only: tinyllm.manifest.fetch_dataset. `data/` is gitignored, so any
# fresh machine (Colab included) needs this to pull the hash-verified dataset.
blob = [
    "azure-storage-blob>=12.27.1",
]
# Hosted MLflow. MLFLOW_TRACKING_URI is an azureml:// URI, so any machine that
# runs train.py needs this plugin or the run logs to a throwaway local ./mlruns.
tracking = [
    "azureml-mlflow>=1.62.0.post5",
]
# Full Azure ML: manifest publish, workspace management.
azure = [
    "azure-ai-ml>=1.34.1",
    "azure-identity>=1.25.3",
    "tinyllm-ops[blob,tracking]",
]
# What a Colab T4 VM needs and nothing more.
colab = [
    "tinyllm-ops[train,blob,tracking]",
]
# Orchestration, Stage 3. Nothing imports zenml yet.
pipelines = [
    "zenml[local]>=0.96.2",
]
# Serving, Stage 4: the FastAPI gateway in front of llama-server. transformers
# without torch is enough for apply_chat_template (the container never loads a model).
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.28.1",
    "transformers>=5.14.1",
    "tokenizers>=0.21",
    "jinja2>=3.1",  # apply_chat_template renders the template with jinja2
]
all = [
    "tinyllm-ops[train,gen,azure,blob,tracking,pipelines,serve]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyllm"]

[tool.uv]
# Local `uv sync` keeps installing everything (via the `local` group below);
# only Colab picks a subset.
default-groups = ["dev", "local"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]  # never collect llama.cpp/ (its own python tests need appium etc.)
markers = ["integration: needs a running gateway (docker run …); select with -m integration --url …"]
addopts = "-m 'not integration'"

[dependency-groups]
local = [
    "tinyllm-ops[all]",
]
dev = [
    "kaggle>=2.2.4",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
