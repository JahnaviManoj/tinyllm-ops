# 5.3 proof: GitHub reaches Azure with NO stored cloud credential.
# GitHub mints a minutes-lived OIDC token for this workflow; Azure trusts it because the app
# registration carries a federated credential for repo:JahnaviManoj/tinyllm-ops on main.
name: azure-login-check

on:
  workflow_dispatch:          # the "Run workflow" button
  push:
    branches: [main]
    paths: [".github/workflows/azure-login-check.yml"]

permissions:
  id-token: write             # lets the job request the OIDC token
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Show the OIDC claims GitHub sends (sub / iss / aud — never the token)
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          python3 - "$TOKEN" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          for k in ("iss", "sub", "aud", "repository", "ref", "event_name"):
              print(f"{k:12s} {claims.get(k)}")
          PY
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}          # IDs, not secrets
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Who am I in Azure?
        run: |
          az account show --query '{subscription:name, tenant:tenantId, user:user.name}' -o table
          az group show -n tinyllm-rg --query '{rg:name, location:location}' -o table
